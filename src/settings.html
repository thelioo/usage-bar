<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Usage Bar</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <nav class="sidebar">
    <div class="brand">
      <img src="icon.png" alt="" width="30" height="30" />
      <div>
        <strong>Usage Bar</strong>
        <span data-i18n="settings"></span>
      </div>
    </div>
    <button class="nav active" data-page="display">
      <svg viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="10" rx="2"/><path d="M7 16.5h6M10 13.5v3"/></svg>
      <span data-i18n="sDisplay"></span>
    </button>
    <button class="nav" data-page="accounts">
      <svg viewBox="0 0 20 20"><circle cx="8" cy="7" r="3"/><path d="M2.5 16.5c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/><path d="M13 4.2a3 3 0 0 1 0 5.6M15 12.4c1.3.6 2.1 1.9 2.5 4.1"/></svg>
      <span data-i18n="sAccounts"></span>
    </button>
    <button class="nav" data-page="data">
      <svg viewBox="0 0 20 20"><path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6M16.5 3.5v3.5H13"/></svg>
      <span data-i18n="sData"></span>
    </button>
    <button class="nav" data-page="general">
      <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      <span data-i18n="sGeneral"></span>
    </button>
    <div class="version" id="version"></div>
  </nav>

  <main>
    <!-- Display -->
    <section class="page active" id="page-display">
      <header><h1 data-i18n="sDisplay"></h1><p data-i18n="descDisplay"></p></header>

      <h2 data-i18n="sMode"></h2>
      <div class="picker" data-key="mode">
        <button value="island">
          <svg viewBox="0 0 120 72"><rect class="scr" x="1" y="1" width="118" height="70" rx="8"/><path class="ink" d="M44 1h32v8a6 6 0 0 1-6 6H50a6 6 0 0 1-6-6z"/></svg>
          <span data-i18n="modeIsland"></span>
        </button>
        <button value="taskbar">
          <svg viewBox="0 0 120 72"><rect class="scr" x="1" y="1" width="118" height="70" rx="8"/><rect class="bar" x="1" y="58" width="118" height="13" rx="0"/><rect class="ink" x="66" y="61" width="30" height="7" rx="3.5"/></svg>
          <span data-i18n="modeTaskbar"></span>
        </button>
        <button value="tray">
          <svg viewBox="0 0 120 72"><rect class="scr" x="1" y="1" width="118" height="70" rx="8"/><rect class="bar" x="1" y="58" width="118" height="13"/><rect class="ink" x="72" y="16" width="40" height="36" rx="5"/><circle class="ink" cx="104" cy="64.5" r="3"/></svg>
          <span data-i18n="modeTray"></span>
        </button>
      </div>

      <div class="group" style="margin-top:14px">
        <div class="row">
          <label data-i18n="sCompact"></label>
          <div class="segmented" data-key="compact_style">
            <i class="thumb"></i>
            <button value="names" data-i18n="compactNames"></button>
            <button value="minimal" data-i18n="compactMinimal"></button>
          </div>
        </div>
      </div>

      <div class="island-only">
        <h2 data-i18n="sPosition"></h2>
        <div class="picker small" data-key="anchor">
          <button value="top">
            <svg viewBox="0 0 120 72"><rect class="scr" x="1" y="1" width="118" height="70" rx="8"/><path class="ink" d="M44 1h32v8a6 6 0 0 1-6 6H50a6 6 0 0 1-6-6z"/></svg>
            <span data-i18n="anchor_top"></span>
          </button>
          <button value="left">
            <svg viewBox="0 0 120 72"><rect class="scr" x="1" y="1" width="118" height="70" rx="8"/><path class="ink" d="M1 22h8a6 6 0 0 1 6 6v16a6 6 0 0 1-6 6H1z"/></svg>
            <span data-i18n="anchor_left"></span>
          </button>
          <button value="right">
            <svg viewBox="0 0 120 72"><rect class="scr" x="1" y="1" width="118" height="70" rx="8"/><path class="ink" d="M119 22h-8a6 6 0 0 0-6 6v16a6 6 0 0 0 6 6h8z"/></svg>
            <span data-i18n="anchor_right"></span>
          </button>
        </div>

        <div class="group">
          <div class="row">
            <label for="monitor" data-i18n="sMonitor"></label>
            <div class="select"><select id="monitor"></select></div>
          </div>
          <div class="row">
            <label data-i18n="sExpand"></label>
            <div class="segmented" data-key="expand_on">
              <i class="thumb"></i>
              <button value="hover" data-i18n="expandHover"></button>
              <button value="click" data-i18n="expandClick"></button>
            </div>
          </div>
        </div>
      </div>
      <p class="hint" data-i18n="dragHint"></p>
    </section>

    <!-- Accounts -->
    <section class="page" id="page-accounts">
      <header><h1 data-i18n="sAccounts"></h1><p data-i18n="descAccounts"></p></header>
      <div id="accounts"></div>
      <p class="hint notice" id="add-hint" hidden data-i18n="addHint"></p>
    </section>

    <!-- Data -->
    <section class="page" id="page-data">
      <header><h1 data-i18n="sData"></h1><p data-i18n="descData"></p></header>
      <div class="group">
        <div class="row">
          <label data-i18n="sRefresh"></label>
          <div class="segmented" data-key="refresh_minutes" id="refresh"><i class="thumb"></i></div>
        </div>
      </div>
      <h2 data-i18n="sProviders"></h2>
      <div class="group">
        <div class="row">
          <label for="claude" class="with-mark"><span class="mark claude">C</span>Claude</label>
          <input type="checkbox" class="switch" id="claude" />
        </div>
        <div class="row">
          <label for="codex" class="with-mark"><span class="mark codex">C</span>Codex</label>
          <input type="checkbox" class="switch" id="codex" />
        </div>
      </div>
    </section>

    <!-- General -->
    <section class="page" id="page-general">
      <header><h1 data-i18n="sGeneral"></h1><p data-i18n="descGeneral"></p></header>
      <div class="group">
        <div class="row">
          <label for="language" data-i18n="sLanguage"></label>
          <div class="select"><select id="language"></select></div>
        </div>
        <div class="row">
          <label for="startup" data-i18n="sStartup"></label>
          <input type="checkbox" class="switch" id="startup" />
        </div>
      </div>

      <h2 data-i18n="sUpdates"></h2>
      <div class="group">
        <div class="row">
          <label for="auto-update" data-i18n="autoUpdate"></label>
          <input type="checkbox" class="switch" id="auto-update" />
        </div>
        <div class="row">
          <div class="title">
            <label id="version-label"></label>
            <small id="update-status"></small>
          </div>
          <button class="btn" id="check-updates"></button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="settings.js"></script>
</body>
</html>
