<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Usage Bar</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    svg.slot {
      position: absolute; overflow: visible;
      opacity: 0; transform: scale(0.85);
      transition: opacity 0.3s cubic-bezier(0.2, 0, 0, 1), transform 0.45s cubic-bezier(0.32, 0.72, 0, 1), filter 0.25s;
    }
    svg.slot path {
      fill: rgba(20, 20, 22, 0.16);
      stroke: rgba(255, 255, 255, 0.55); stroke-width: 1;
      transition: fill 0.2s, stroke 0.2s;
      vector-effect: non-scaling-stroke;
    }
    body.on svg.slot { opacity: 1; transform: none; }
    svg.slot.active { transform: scale(1.06); filter: drop-shadow(0 0 12px rgba(48, 209, 88, 0.45)); }
    svg.slot.active path { fill: rgba(48, 209, 88, 0.14); stroke: rgba(48, 209, 88, 0.95); stroke-width: 1.5; }
  </style>
</head>
<body>
  <script>
    const { listen } = window.__TAURI__.event;
    let active = null;

    /**
     * Outline of each slot, matching the island's shape there (the left side mirrors the right).
     */
    function outline(id, w, h) {
      if (id === "taskbar") return { d: roundRect(w, h, 8), flip: "" };
      if (id === "top") return { d: `M0 0 H${w} V${h - 14} A14 14 0 0 1 ${w - 14} ${h} H14 A14 14 0 0 1 0 ${h - 14} Z`, flip: "" };
      if (id === "left" || id === "right") {
        const d = `M${w} 0 V${h} H14 A14 14 0 0 1 0 ${h - 14} V14 A14 14 0 0 1 14 0 Z`;
        return { d, flip: id === "left" ? "scale(-1,1)" : "" };
      }
      return { d: roundRect(w, h, 14), flip: "" };
    }
    const roundRect = (w, h, r) =>
      `M${r} 0 H${w - r} A${r} ${r} 0 0 1 ${w} ${r} V${h - r} A${r} ${r} 0 0 1 ${w - r} ${h} H${r} A${r} ${r} 0 0 1 0 ${h - r} V${r} A${r} ${r} 0 0 1 ${r} 0 Z`;

    // Drop slots fade in one after another, then the nearest one lights up.
    listen("overlay-slots", ({ payload: slots }) => {
      document.body.classList.remove("on");
      document.body.innerHTML = slots.map((s, i) => {
        const { d, flip } = outline(s.id, s.w, s.h);
        return `<svg class="slot" data-id="${s.id}" width="${s.w}" height="${s.h}" viewBox="0 0 ${s.w} ${s.h}"
          style="left:${s.x}px;top:${s.y}px;transition-delay:${i * 25}ms,${i * 25}ms,0s">
          <g transform-origin="${s.w / 2} ${s.h / 2}" transform="${flip}"><path d="${d}"/></g></svg>`;
      }).join("");
      if (slots.length) requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("on")));
      mark();
    });
    listen("overlay-active", ({ payload }) => { active = payload; mark(); });
    function mark() {
      document.querySelectorAll(".slot").forEach((el) => el.classList.toggle("active", el.dataset.id === active));
    }
  </script>
</body>
</html>
