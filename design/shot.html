<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../src/styles.css" />
<style>
  html, body { width: 100%; height: 100%; }
  body {
    background:
      radial-gradient(60% 80% at 20% 30%, #3b3f8f 0%, transparent 60%),
      radial-gradient(50% 70% at 85% 70%, #b0476b 0%, transparent 60%),
      radial-gradient(70% 90% at 60% 110%, #e08a3c 0%, transparent 55%),
      #16172b;
  }
  *, *::before, *::after { transition: none !important; }
  #island { transform: translateX(-50%) scale(var(--zoom, 1)); transform-origin: top center; }
</style>
</head>
<body>
  <div id="island">
    <div id="clip">
      <div id="compact">
        <span class="chip"><span class="name">Claude</span><svg class="ring" viewBox="0 0 15 15"><circle class="bg" cx="7.5" cy="7.5" r="6"/><circle class="fg" cx="7.5" cy="7.5" r="6" stroke="var(--ok)" stroke-dasharray="15.8 37.7"/></svg>42%</span>
        <span class="chip"><span class="name">Codex</span><svg class="ring" viewBox="0 0 15 15"><circle class="bg" cx="7.5" cy="7.5" r="6"/><circle class="fg" cx="7.5" cy="7.5" r="6" stroke="var(--warn)" stroke-dasharray="28.7 37.7"/></svg>76%</span>
      </div>
      <div id="details">
        <header><span class="title">Plan usage</span><span id="updated" class="dim">09:41</span>
          <button id="refresh"><svg viewBox="0 0 16 16" width="13" height="13"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></header>
        <div id="accounts">
          <section>
            <div class="acc-head"><span class="name">Claude</span><span class="plan">max</span></div>
            <div class="acc-meta">you@example.com · Windows + WSL: Ubuntu</div>
            <div class="win"><div class="row"><span>Session (5h)</span><b>42%</b></div><div class="bar"><div style="width:42%;background:var(--ok)"></div></div><div class="reset">Resets in 2h 18m</div></div>
            <div class="win"><div class="row"><span>Weekly</span><b>23%</b></div><div class="bar"><div style="width:23%;background:var(--ok)"></div></div><div class="reset">Resets in 4d 6h</div></div>
          </section>
          <section>
            <div class="acc-head"><span class="name">Codex</span><span class="plan">pro</span></div>
            <div class="acc-meta">you@example.com · WSL: Ubuntu</div>
            <div class="win"><div class="row"><span>Session (5h)</span><b>18%</b></div><div class="bar"><div style="width:18%;background:var(--ok)"></div></div><div class="reset">Resets in 3h 02m</div></div>
            <div class="win"><div class="row"><span>Weekly</span><b>76%</b></div><div class="bar"><div style="width:76%;background:var(--warn)"></div></div><div class="reset">Resets in 1d 19h</div></div>
          </section>
        </div>
      </div>
    </div>
  </div>
<script>
  const state = new URLSearchParams(location.search).get("state");
  const island = document.getElementById("island");
  document.documentElement.style.setProperty("--zoom", state === "compact" ? 2.4 : 1.6);
  if (state === "compact") {
    island.style.width = document.getElementById("compact").scrollWidth + "px";
    island.style.height = "32px";
  } else {
    island.classList.add("expanded");
    island.style.width = "380px";
    island.style.height = document.getElementById("details").scrollHeight + "px";
  }
</script>
</body>
</html>
