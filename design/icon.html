<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }

  /* Squircle tile */
  .tile {
    position: absolute; inset: 64px;
    border-radius: 224px;
    background:
      radial-gradient(120% 90% at 50% 0%, #2a2a2e 0%, #141416 55%, #0a0a0b 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.10),
      inset 0 -2px 0 rgba(0,0,0,0.6);
    overflow: hidden;
  }

  /* The island, hanging from the top edge with concave ears */
  .notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 300px; height: 76px;
    background: #000;
    border-radius: 0 0 38px 38px;
  }
  .notch::before, .notch::after {
    content: ""; position: absolute; top: 0; width: 29px; height: 28px;
  }
  .notch::before { left: -28px; background: radial-gradient(circle at 0 100%, transparent 27.5px, #000 28px); }
  .notch::after  { right: -28px; background: radial-gradient(circle at 100% 100%, transparent 27.5px, #000 28px); }
  .dot {
    position: absolute; top: 24px; right: 44px; width: 28px; height: 28px; border-radius: 50%;
    background: #30d158; box-shadow: 0 0 18px rgba(48,209,88,0.7);
  }

  /* Usage ring */
  .ring {
    position: absolute; left: 50%; top: 54%; transform: translate(-50%, -50%);
    width: 540px; height: 540px; border-radius: 50%;
    --thick: 84px;
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--thick)), #000 calc(100% - var(--thick) + 1px));
  }
  .track { background: #232326; }
  .fill {
    background: conic-gradient(from 0deg, #30d158 0deg, #9be15d 130deg, #ffd60a 200deg, #ff9f0a 252deg, transparent 252.5deg);
  }
  /* Round cap at the end of the arc */
  .cap {
    position: absolute; left: 50%; top: 54%; width: 84px; height: 84px; border-radius: 50%;
    background: #ff9f0a;
    transform: translate(-50%, -50%) rotate(252deg) translateY(-228px);
  }
  .cap.start { background: #30d158; transform: translate(-50%, -50%) translateY(-228px); }
</style>
</head>
<body>
  <div class="tile">
    <div class="notch"><div class="dot"></div></div>
  </div>
  <div class="ring track"></div>
  <div class="ring fill"></div>
  <div class="cap start"></div>
  <div class="cap"></div>
</body>
</html>
