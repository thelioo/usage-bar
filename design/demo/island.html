<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Usage Bar</title>
  <base href="../../src/" />
  <script>
    // Demo stub of the Tauri API; the stage pages drive it through window.demo.
    const listeners = {};
    const settings = { mode: "island", anchor: "top", expand_on: "hover", language: "en", providers: { claude: true, codex: true } };
    const hours = (h) => new Date(Date.now() + h * 3.6e6).toISOString();
    let snap = {
      accounts: [
        { id: "work", provider: "claude", email: "me@acme.com", alias: "Work", plan: "max", org: "Acme", active: true, sources: ["Windows", "WSL: Ubuntu"],
          windows: [{ kind: "session", used_percent: 33, resets_at: hours(2.3) }, { kind: "weekly", used_percent: 20, resets_at: hours(72) }] },
        { id: "codex", provider: "codex", email: "you@example.com", plan: "pro", active: true, sources: ["WSL: Ubuntu"],
          windows: [{ kind: "session", used_percent: 41, resets_at: hours(3) }, { kind: "weekly", used_percent: 76, resets_at: hours(44) }] },
      ],
      updated_at: new Date().toISOString(),
    };
    let onSwitch = null;
    // The hosting page's backend may not exist yet when this frame runs: queue calls until it does.
    function hosted(label) {
      const ready = new Promise((resolve) => {
        const poll = () => (window.parent.usageBarBackend ? resolve(window.parent.usageBarBackend.connect(window, label)) : setTimeout(poll, 20));
        poll();
      });
      return {
        core: { invoke: (cmd, args) => ready.then((b) => b.core.invoke(cmd, args)) },
        event: { listen: (name, fn) => ready.then((b) => b.event.listen(name, fn)) },
        window: { getCurrentWindow: () => ({ label }) },
      };
    }
    // On the website, the page hosting this frame provides the backend (see site/site.js), and
    // the frame's role (main island, taskbar widget or tray panel) comes from ?label=.
    const label = new URLSearchParams(location.search).get("label") || "main";
    const host = window.parent !== window && window.parent.document.documentElement.hasAttribute("data-usage-bar-host");
    window.__TAURI__ = host ? hosted(label) : {
      core: {
        invoke: async (cmd, args) => {
          if (cmd === "get_settings") return settings;
          if (cmd === "get_usage") return snap;
          if (cmd === "switch_account" && onSwitch) return onSwitch(args);
          return null;
        },
      },
      event: { listen: async (name, fn) => { listeners[name] = fn; return () => {}; } },
      window: { getCurrentWindow: () => ({ label: "main" }) },
    };
    const emit = (name, payload) => listeners[name]?.({ payload });
    window.demo = {
      hover: (inside) => emit("island-hover", inside),
      anchor: (anchor) => { settings.anchor = anchor; emit("settings-changed", { ...settings }); },
      land: () => emit("drop-enter", null),
      setSnap: (next) => { snap = next; emit("usage-updated", snap); },
      getSnap: () => snap,
      onSwitch: (fn) => { onSwitch = fn; },
      switched: (payload) => emit("account-switched", payload),
    };
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
  <div class="piece arm"></div>
  <div class="piece ear"></div><div class="piece ear"></div>
  <div id="island">
   <div id="clip">
    <div id="compact"><span class="dim" data-i18n="loading"></span></div>
    <div id="compact-v"></div>
    <div id="details">
      <header>
        <span class="title" data-i18n="title"></span>
        <span id="updated" class="dim"></span>
        <button id="open-settings" class="icon-btn" data-i18n-title="settings">
          <svg viewBox="0 0 16 16" width="13" height="13"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button id="refresh" class="icon-btn" data-i18n-title="refresh">
          <svg viewBox="0 0 16 16" width="13" height="13"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </header>
      <div id="accounts"></div>
      <div class="grabber" data-i18n-title="dragHint"></div>
    </div>
   </div>
  </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
